<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Account — College Resource Hub</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #F1E9D8;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .register-container {
      width: 400px;
      background: #FBF7EE;
      padding: 40px;
      border: 1px solid #D5CCBA;
      border-radius: 8px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
    }

    .logo {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo h1 {
      color: #1B2A41;
      font-size: 27px;
      margin-bottom: 8px;
    }

    .logo p {
      color: #6E7F6C;
      font-size: 13px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #1B2A41;
      font-size: 14px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #C8C0B0;
      border-radius: 4px;
      font-size: 14px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #1B2A41;
    }

    .register-btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 4px;
      background: #1B2A41;
      color: white;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    .register-btn:hover {
      background: #A23B2E;
    }

    .login-link {
      text-align: center;
      margin-top: 22px;
      font-size: 13px;
      color: #6E7F6C;
    }

    .login-link a {
      color: #1B2A41;
      font-weight: bold;
      text-decoration: none;
    }

    .login-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="register-container">

    <div class="logo">
      <h1>Create Account</h1>
      <p>College Resource Hub</p>
    </div>

    <form id="registerForm">

      <div class="form-group">
        <label for="name">Full Name</label>

        <input
          type="text"
          id="name"
          placeholder="Enter your full name"
          required
        >
      </div>

      <div class="form-group">
        <label for="collegeId">College ID</label>

        <input
          type="text"
          id="collegeId"
          placeholder="Enter your college ID"
          required
        >
      </div>

      <div class="form-group">
        <label for="email">College Email</label>

        <input
          type="email"
          id="email"
          placeholder="Enter your college email"
          required
        >
      </div>

      <div class="form-group">
        <label for="branch">Branch</label>

        <select id="branch" required>
          <option value="">Select your branch</option>
          <option value="AIML">AIML</option>
          <option value="DS">Data Science</option>
          <option value="COMPS">Computer Engineering</option>
          <option value="IT">Information Technology</option>
          <option value="ECS">Electronics & Computer Science</option>
          <option value="CIVIL">Civil Engineering</option>
          <option value="MECHANICAL">Mechanical Engineering</option>
        </select>
      </div>

      <div class="form-group">
        <label for="password">Password</label>

        <input
          type="password"
          id="password"
          placeholder="Create a password"
          required
        >
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>

        <input
          type="password"
          id="confirmPassword"
          placeholder="Confirm your password"
          required
        >
      </div>

      <button type="submit" class="register-btn" id="regBtn">
        CREATE ACCOUNT
      </button>

    </form>

    <div class="login-link">
      Already have an account?
      <a href="/login">Login</a>
    </div>

    <div style="text-align: center; margin-top: 14px;">
      <a href="/" style="font-size: 13px; color: #1B2A41; text-decoration: none;">← Return to College Resource Hub</a>
    </div>

  </div>

  <script>
    document.getElementById("registerForm").addEventListener("submit", async function(event) {
      event.preventDefault();

      const name = document.getElementById("name").value.trim();
      const college_id = document.getElementById("collegeId").value.trim();
      const email = document.getElementById("email").value.trim();
      const branch = document.getElementById("branch").value;
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;
      const btn = document.getElementById("regBtn");

      if (password !== confirmPassword) {
        alert("Passwords do not match.");
        return;
      }

      if (password.length < 6) {
        alert("Password must be at least 6 characters long.");
        return;
      }

      btn.disabled = true;
      btn.textContent = "CREATING ACCOUNT...";

      try {
        const response = await fetch("/api/auth/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, college_id, email, branch, password })
        });

        const data = await response.json();

        if (data.success) {
          alert("Account created successfully! Welcome, " + name);
          window.location.href = "/";
        } else {
          alert(data.error || "Registration failed.");
        }
      } catch (err) {
        alert("Could not connect to server. Please make sure backend is running.");
      } finally {
        btn.disabled = false;
        btn.textContent = "CREATE ACCOUNT";
      }
    });
  </script>

</body>
</html>
