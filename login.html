<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>College Resource Hub — Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #F1E9D8;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
    }

    .login-container {
      width: 380px;
      background: #FBF7EE;
      padding: 40px;
      border: 1px solid #D5CCBA;
      border-radius: 8px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
    }

    .logo {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo h1 {
      color: #1B2A41;
      font-size: 28px;
      margin-bottom: 8px;
    }

    .logo p {
      color: #6E7F6C;
      font-size: 13px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      color: #1B2A41;
      font-size: 14px;
      font-weight: bold;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 12px;
      border: 1px solid #C8C0B0;
      border-radius: 4px;
      font-size: 14px;
      outline: none;
    }

    .form-group input:focus,
    .form-group select:focus {
      border-color: #1B2A41;
    }

    .login-btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 4px;
      background: #1B2A41;
      color: white;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    .login-btn:hover {
      background: #A23B2E;
    }

    .forgot {
      text-align: center;
      margin-top: 18px;
    }

    .forgot a {
      color: #1B2A41;
      font-size: 13px;
      text-decoration: none;
    }

    .forgot a:hover {
      text-decoration: underline;
    }

    .register {
      text-align: center;
      margin-top: 25px;
      padding-top: 20px;
      border-top: 1px solid #D5CCBA;
      font-size: 13px;
      color: #6E7F6C;
    }

    .register a {
      color: #1B2A41;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="login-container">

    <div class="logo">
      <h1>College Resource Hub</h1>
      <p>Previous Year Question Papers</p>
    </div>

    <form id="loginForm">

      <div class="form-group">
        <label for="role">Login As</label>

        <select id="role">
          <option value="student">Student</option>
          <option value="admin">Admin</option>
        </select>
      </div>

      <div class="form-group">
        <label for="email">College ID / Email</label>

        <input
          type="text"
          id="email"
          placeholder="Enter your college ID or email"
          required
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>

        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          required
        >
      </div>

      <button type="submit" class="login-btn" id="loginBtn">
        LOGIN
      </button>

    </form>

    <div id="demoAccountsBox" style="display: none; margin-top: 18px; padding-top: 14px; border-top: 1px dashed #D5CCBA; text-align: center;">
      <div style="font-size: 11px; color: #6E7F6C; margin-bottom: 8px; font-weight: bold;">Local Machine Demo Logins:</div>
      <div style="display: flex; flex-wrap: wrap; gap: 5px; justify-content: center;">
        <button type="button" style="font-size: 11px; padding: 4px 8px; border: 1px solid #A23B2E; color: #A23B2E; background: #fff; cursor: pointer; border-radius: 3px;" onclick="fillLogin('admin1@college.edu', 'happy1100', 'admin')">Admin 1 (Anukalp Sharma)</button>
        <button type="button" style="font-size: 11px; padding: 4px 8px; border: 1px solid #A23B2E; color: #A23B2E; background: #fff; cursor: pointer; border-radius: 3px;" onclick="fillLogin('admin2@college.edu', 'prachi1100', 'admin')">Admin 2 (Prachi Sharma)</button>
        <button type="button" style="font-size: 11px; padding: 4px 8px; border: 1px solid #A23B2E; color: #A23B2E; background: #fff; cursor: pointer; border-radius: 3px;" onclick="fillLogin('admin3@college.edu', 'johara1100', 'admin')">Admin 3 (Johara Shaikh)</button>
        <button type="button" style="font-size: 11px; padding: 4px 8px; border: 1px solid #1B2A41; color: #1B2A41; background: #fff; cursor: pointer; border-radius: 3px;" onclick="fillLogin('student@college.edu', 'student123', 'student')">Student</button>
      </div>
    </div>

    <div class="forgot">
      <a href="/">← Return to College Resource Hub</a>
    </div>

    <div class="register">
      Don't have an account?
     <a href="/register">Create Account</a>
    </div>

  </div>

  <script>
    if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
      const dbx = document.getElementById("demoAccountsBox");
      if (dbx) dbx.style.display = "block";
    }

    function fillLogin(email, pwd, role) {
      document.getElementById("email").value = email;
      document.getElementById("password").value = pwd;
      document.getElementById("role").value = role;
    }

    document.getElementById("loginForm").addEventListener("submit", async function(event) {
      event.preventDefault();

      const role = document.getElementById("role").value;
      const identifier = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const btn = document.getElementById("loginBtn");

      if (identifier === "" || password === "") {
        alert("Please enter your College ID / Email and Password.");
        return;
      }

      btn.disabled = true;
      btn.textContent = "VERIFYING...";

      try {
        const response = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ identifier, password, role })
        });

        const data = await response.json();

        if (data.success) {
          alert(`Welcome back, ${data.user.name}!`);
          window.location.href = "/";
        } else {
          alert(data.error || "Login failed. Please check your credentials.");
        }
      } catch (err) {
        alert("Could not connect to backend server. Make sure 'python app.py' is running.");
      } finally {
        btn.disabled = false;
        btn.textContent = "LOGIN";
      }
    });
  </script>

</body>
</html>
